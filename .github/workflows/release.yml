name: Release builds

# Builds the client and server for Linux and Windows.
# - On a version tag (v0.1.0): attaches the zips to a GitHub Release.
# - Manually (Actions → Release builds → Run workflow): uploads the zips as
#   workflow artifacts you can download from the run page.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            client: sf-client
            server: sf-server
          - os: windows-latest
            name: windows-x86_64
            client: sf-client.exe
            server: sf-server.exe
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies (Bevy / winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release -p sf-client -p sf-server
      - name: Package
        shell: bash
        run: |
          set -eu
          dist="star-fight-${{ matrix.name }}"
          mkdir -p "$dist"
          cp "target/release/${{ matrix.client }}" "target/release/${{ matrix.server }}" "$dist/"
          cp -r assets "$dist/assets"
          cp README.md "$dist/" 2>/dev/null || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dist.zip" "$dist"
          else
            zip -r "$dist.zip" "$dist"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: star-fight-${{ matrix.name }}
          path: star-fight-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
