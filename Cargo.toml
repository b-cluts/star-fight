[workspace]
resolver = "2"
members = ["crates/sf-core", "crates/sf-proto", "crates/sf-server", "crates/sf-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/b-cluts/star-fight"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
