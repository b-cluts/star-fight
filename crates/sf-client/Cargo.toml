[package]
name = "sf-client"
version.workspace = true
edition.workspace = true

[dependencies]
sf-core = { path = "../sf-core" }
sf-proto = { path = "../sf-proto" }
# Networking bridge (background thread with its own small runtime).
tokio = { version = "1", features = ["rt", "net", "sync", "time", "io-util", "macros"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
# Trimmed feature set: 2D sprites, UI text, gizmos, states, PNG — no audio/3D/gltf.
bevy = { version = "0.16", default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_log",
    "bevy_render",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "wayland",
    "x11",
] }
