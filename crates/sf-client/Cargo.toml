[package]
name = "sf-client"
version.workspace = true
edition.workspace = true

[dependencies]
sf-core = { path = "../sf-core" }
sf-proto = { path = "../sf-proto" }
# Trimmed feature set: 2D sprites, UI text, gizmos, PNG — no audio/3D/gltf.
bevy = { version = "0.16", default-features = false, features = [
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_log",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "wayland",
    "x11",
] }
